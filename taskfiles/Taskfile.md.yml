# https://taskfile.dev
version: "3"

vars:
  # Latest version of MarkdownLint:
  #   - https://hub.docker.com/r/davidanson/markdownlint-cli2/tags
  #   - https://github.com/DavidAnson/markdownlint-cli2/tags
  MARKDOWNLINT_VERSION: v0.23.3
  # Latest version of Node: https://hub.docker.com/_/node/tags
  NODE_VERSION: 24.21.0-bookworm

tasks:

  check:
    desc: Check the style of Markdown files with markdownlint
    cmds:
      - docker run
        --rm
        --volume "{{.ROOT_DIR}}:/workdir"
        davidanson/markdownlint-cli2:{{.MARKDOWNLINT_VERSION}}
        {{.SUB_CMD}}
        {{.CLI_ARGS}}

  fix:
    desc: Fix Markdown style — align tables, then apply autofixable lint rules
    cmds:
      - task: fix-tables
      - task: check
        vars:
          SUB_CMD: --fix

  fix-tables:
    desc: Align table spacing in Markdown files
    cmds:
      # dotglob so hidden directories (e.g. .github) are covered too.
      - docker run
        --rm
        --volume "{{.ROOT_DIR}}:/app"
        --workdir /app
        node:{{.NODE_VERSION}}
        bash -c "shopt -s globstar dotglob && npx --yes markdown-table-formatter **/*.md"
